plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nexusvpn.secure'
    compileSdk 34

    defaultConfig {
        applicationId "com.nexusvpn.secure"
        minSdk 24
        targetSdk 34
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
